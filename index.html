<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='20' height='20' rx='3' fill='none' stroke='%23e0672b' stroke-width='3'/%3E%3Cpath d='M17 3h12v12M29 3L17 15' fill='none' stroke='%23e0672b' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<!--
  Container page: every tool from switcher.js is loaded into its own full-window
  frame, and switching just shows a different one, so no page reload and each
  tool keeps its photos. Edit the tools themselves in resize.html / frame.html.
-->
<style>
  html, body { margin: 0; height: 100%; background: #1b1a18; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #1b1a18; }
  iframe.off { visibility: hidden; pointer-events: none; }
</style>
<script src="switcher.js"></script>
</head>
<body>
<noscript><p style="color:#ece8e2;font:15px system-ui;padding:24px">Turn on JavaScript, or open <a style="color:#e0672b" href="resize.html">Image Resizer</a> / <a style="color:#e0672b" href="frame.html">Photo Framer</a> directly.</p></noscript>
<script>
(() => {
  const TOOLS = window.PHOTO_TOOLS || [];
  const byKey = Object.fromEntries(TOOLS.map((t) => [t.key, t]));
  const frames = {};
  let current = null;

  // Clean URL on the real site (image.asahina.me/#frame instead of /index.html#frame).
  const base = /^https?:$/.test(location.protocol) ? location.pathname.replace(/index\.html$/, "") : location.pathname;

  function frameFor(key) {
    if (!frames[key]) {
      const f = document.createElement("iframe");
      f.src = byKey[key].file + "?embed";
      f.title = byKey[key].title;
      f.className = "off";
      document.body.append(f);
      frames[key] = f;
    }
    return frames[key];
  }

  function show(key, push) {
    if (!byKey[key]) key = TOOLS[0].key;
    if (key !== current) {
      const f = frameFor(key);
      Object.entries(frames).forEach(([k, el]) => el.classList.toggle("off", k !== key));
      current = key;
      document.title = byKey[key].title;
      try { localStorage.setItem("phototools.tool", key); } catch (_) {}
      try { f.contentWindow.focus(); } catch (_) {}
    }
    const url = base + "#" + key;
    if (location.pathname + location.hash !== url) history[push ? "pushState" : "replaceState"](null, "", url);
  }

  // ---- Shared photo list (see shared-photos.js) ----
  let photos = [];   // [{ id, file }] in list order
  function relay(msg, except) {
    Object.values(frames).forEach((f) => { if (f.contentWindow !== except) f.contentWindow.postMessage(msg, "*"); });
  }
  function onPhotos(d, source) {
    if (d.type === "hello") {             // a tool just loaded: give it the current list
      if (photos.length) source.postMessage({ type: "add", photos, sharedPhotos: true }, "*");
      return;
    }
    if (d.type === "add") d.photos.forEach((p) => { if (!photos.some((x) => x.id === p.id)) photos.push(p); });
    else if (d.type === "remove") photos = photos.filter((p) => !d.ids.includes(p.id));
    else if (d.type === "clear") photos = [];
    else if (d.type === "order") {
      const pos = new Map(d.ids.map((id, n) => [id, n]));
      photos.sort((a, b) => (pos.get(a.id) ?? 1e9) - (pos.get(b.id) ?? 1e9));
    } else return;
    relay(d, source);
  }

  window.addEventListener("message", (e) => {
    const fromTool = Object.values(frames).some((f) => f.contentWindow === e.source);
    if (!fromTool || !e.data) return;
    if (e.data.sharedPhotos) onPhotos(e.data, e.source);
    else if (e.data.type === "phototools:switch") show(e.data.key, true);
  });
  window.addEventListener("popstate", () => show(location.hash.slice(1)));
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));

  let saved = null;
  try { saved = localStorage.getItem("phototools.tool"); } catch (_) {}
  const hash = location.hash.slice(1);
  show(byKey[hash] ? hash : saved);

  // Load the other tools quietly once the first one is up, so switching is instant.
  frames[current].addEventListener("load", () => {
    setTimeout(() => TOOLS.forEach((t) => frameFor(t.key)), 400);
  }, { once: true });
})();
</script>
</body>
</html>
